name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LOL_TFT_COOKIE: ''
      LOL_TFT_MOCK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          # jsdom 30 / undici 8 需要 Node 22.22+ 或 24.15+，CI 固定用 24.x
          node-version: '24.x'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build:all
      # 构建后的入库产物必须与源码一致，防止提交旧脚本/旧 UI
      - run: git diff --exit-code -- userscript
      - run: npm run test:coverage