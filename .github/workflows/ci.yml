name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LOL_TFT_COOKIE: ''
      LOL_TFT_MOCK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:userscript
      - name: Verify built userscript
        run: |
          node -e "require('node:fs').accessSync('dist/userscript/lol-tft.user.js')"
          npm test -- tests/userscriptBundle.test.ts
