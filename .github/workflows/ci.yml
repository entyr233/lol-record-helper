name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LOL_TFT_COOKIE: ''
      LOL_TFT_MOCK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      # required check 始终运行；文档-only 只做轻量检测
      - name: Detect changed areas
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! files=$(git diff --name-only "$BASE_SHA...$HEAD_SHA"); then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              *.md|docs/*|LICENSE|.github/ISSUE_TEMPLATE/*|.github/PULL_REQUEST_TEMPLATE.md) ;;
              *) code=true ;;
            esac
          done <<< "$files"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Docs-only change
        if: steps.changes.outputs.code != 'true'
        run: echo "Only docs/markdown changed; skipping lint/build/tests."

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.changes.outputs.code == 'true'
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci --no-audit --no-fund
        if: steps.changes.outputs.code == 'true'
      - run: npm run lint
        if: steps.changes.outputs.code == 'true'
      - run: npm run build:all
        if: steps.changes.outputs.code == 'true'
      # 构建后的入库产物必须与源码一致，防止提交旧脚本/旧 UI
      - run: git diff --exit-code -- userscript
        if: steps.changes.outputs.code == 'true'
      - run: npx playwright install --with-deps chromium
        if: steps.changes.outputs.code == 'true'
      - run: npm run test:e2e
        if: steps.changes.outputs.code == 'true'
      # 常规 CI 只跑一次完整单测（覆盖率模式包含全量测试）
      - run: npm run test:coverage
        if: steps.changes.outputs.code == 'true'