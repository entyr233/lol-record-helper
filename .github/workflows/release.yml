name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify tag matches package.json
        run: |
          node -e "const v = require('./package.json').version; if ('v' + v !== process.env.GITHUB_REF_NAME) { console.error('tag/package version mismatch'); process.exit(1); }"
      - run: npm run build:all
      - run: npm test
      - name: Check release publication state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' > /tmp/lol-release-draft; then
            if [ "$(cat /tmp/lol-release-draft)" != "true" ]; then
              echo 'Release is already public; publish changes with a new version.'
              exit 1
            fi
          fi
      - name: Upload draft release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          generate_release_notes: true
          files: |
            userscript/lol-tft.user.js
            dist/userscript/lol-tft-ui.js
      - name: Publish UI fallback branch
        run: |
          git ls-remote origin refs/heads/ui
          sha256sum dist/userscript/lol-tft-ui.js
          cp dist/userscript/lol-tft-ui.js /tmp/lol-tft-ui.js
          git checkout --orphan ui
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/lol-tft-ui.js ./lol-tft-ui.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lol-tft-ui.js
          git commit -m "ui: ${GITHUB_REF_NAME}"
          git push --force origin HEAD:ui
      - name: Publish prepared release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
